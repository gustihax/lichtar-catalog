name: Каталог з релізу

# Коли на GitHub публікується Release патча, каталог оновлюється сам.
on:
  release:
    types: [published]

permissions:
  contents: write

concurrency:
  group: catalog
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Оновити catalog.json
        run: python3 tools/release_to_catalog.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Зберегти зміни
        env:
          TAG: ${{ github.event.release.tag_name }}
          BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git config user.name "lichtar-bot"
          git config user.email "lichtar-bot@users.noreply.github.com"
          git add catalog.json
          if git diff --cached --quiet; then echo "Без змін"; exit 0; fi
          git commit -m "Каталог: $TAG"
          git pull --rebase origin "$BRANCH"
          git push origin "HEAD:$BRANCH"
